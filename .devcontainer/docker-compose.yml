services:
  traefik:
      image: traefik:v3.0
      container_name: ${THEME_SLUG:-meros-wp}_dev_traefik
      command:
        - "--api.dashboard=true"
        - "--providers.docker=true"
        - "--providers.docker.exposedbydefault=false"
        - "--providers.file.directory=/certs"
        - "--entrypoints.web.address=:80"
        - "--entrypoints.websecure.address=:443"
      ports:
        - "80:80"
        - "443:443"
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock:ro
        - ./certs:/certs
      restart: unless-stopped

  db:
    image: mariadb:10.11
    container_name: ${THEME_SLUG:-meros-wp}_dev_db
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-dbuser}
      MARIADB_PASSWORD: ${DB_PASSWORD:-dbpassword}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${THEME_SLUG:-meros-wp}_dev_wordpress
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wp.rule=Host(`${LOCAL_DOMAIN}`)"
      - "traefik.http.routers.wp.entrypoints=websecure"
      - "traefik.http.routers.wp.tls=true"
      - "traefik.http.services.wp.loadbalancer.server.port=80"
    depends_on:
      db:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ${THEME_SLUG:-meros-wp}_dev_phpmyadmin
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wp.rule=Host(`pma.${LOCAL_DOMAIN}`)"
      - "traefik.http.routers.pma.entrypoints=websecure"
      - "traefik.http.routers.pma.tls=true"
      - "traefik.http.services.pma.loadbalancer.server.port=80"
    environment:
      PMA_HOST: db

volumes:
  db_data: