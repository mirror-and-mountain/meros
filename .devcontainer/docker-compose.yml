services:

  db:
    image: mysql:8
    restart: always
    container_name: ${WP_THEME_NAME:-meros-blocks}_dev_db
    environment:
      MYSQL_DATABASE: ${WP_DB_NAME:-wordpress}
      MYSQL_USER: ${WP_DB_USER:-dbuser}
      MYSQL_PASSWORD: ${WP_DB_PASSWORD:-dbpassword}
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${WP_THEME_NAME:-meros-blocks}_dev_app
    ports:
      - "8000:80"
    volumes:
      - ..:/var/www/html/wp-content/themes/${WP_THEME_NAME:-meros-blocks}
    restart: "no"
    depends_on:
      db:
        condition: service_started

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    container_name: ${WP_THEME_NAME:-meros-blocks}_dev_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword
    restart: "no"
    depends_on:
      db:
        condition: service_started

volumes:
  db_data: