version: "3.9"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WP_THEME_NAME: ${WP_THEME_NAME:-meros-blocks}
    container_name: meros_blocks_dev_app
    ports:
      - "8000:80"
    volumes:
      - ..:/var/www/html/themes/${WP_THEME_NAME:-meros-blocks}
    depends_on:
      - db

  db:
    image: mysql:8
    restart: always
    container_name: meros_blocks_dev_db
    environment:
      MYSQL_DATABASE: ${WP_DB_NAME:-wordpress}
      MYSQL_USER: ${WP_DB_USER:-dbuser}
      MYSQL_PASSWORD: ${WP_DB_PASSWORD:-dbpassword}
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
